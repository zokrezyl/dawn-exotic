name: build-windows

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches dawn-version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(tr -d '[:space:]' < dawn-version)"
          tag_stripped="${tag#v}"
          if [[ "${tag_stripped}" != "${version}" ]]; then
            echo "ERROR: tag '${tag}' does not match dawn-version '${version}'" >&2
            echo "       (compared as '${tag_stripped}' vs '${version}')" >&2
            exit 1
          fi
          echo "tag '${tag}' matches dawn-version '${version}'"
          echo "dawn_version=${version}" >> "$GITHUB_OUTPUT"

      # Puts cl.exe / the MSVC toolchain on PATH for all later steps (exported
      # to $GITHUB_ENV), so the Ninja build in build.ps1 finds the compiler.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ninja and CMake come from depot_tools (added to PATH by build.ps1) and
      # the runner image respectively — no extra setup step needed.

      - name: Cache depot_tools + Dawn source
        uses: actions/cache@v4
        with:
          path: |
            .cache/depot_tools
            .cache/dawn-${{ steps.ver.outputs.dawn_version }}
          key: dawn-windows-${{ steps.ver.outputs.dawn_version }}

      - name: Build (Release)
        shell: pwsh
        run: ./build-tools/windows/build.ps1

      - name: List release tarballs
        shell: pwsh
        run: Get-ChildItem release

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          fail_on_unmatched_files: true
